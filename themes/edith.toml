[metadata]
name = "E.D.I.T.H."
author = "priyanshu"
description = "Cyan-orange theme inspired by Spider-Man's AI"
version = "1.0.0"
tags = ["dark", "marvel", "cyan", "minimal"]

[colors]
background = "#0F1419"
foreground = "#E6E9ED"
cursor = "#33B5E5"
selection_bg = "#33B5E5"
selection_fg = "#0F1419"

[colors.normal]
black = "#1A2332"
red = "#E23636"
green = "#7DCE82"
yellow = "#E5A033"
blue = "#33B5E5"
magenta = "#A37ACC"
cyan = "#56C2D6"
white = "#E6E9ED"

[colors.bright]
black = "#4A5568"
red = "#FF5555"
green = "#98E89E"
yellow = "#F5C84C"
blue = "#5BC4F1"
magenta = "#C4A7E7"
cyan = "#7AD4E4"
white = "#FFFFFF"

[prompt]
icon = "🕷️"
home_symbol = "PARKER"
path_color = "#33B5E5"
git_color = "#E5A033"
success_symbol = "›"
error_symbol = "›"
